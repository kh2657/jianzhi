appId: com.kh.mathworkbench
protocols:
  - name: mathworkbench
    schemes:
      - mathworkbench
productName: 数学学习工作台
copyright: private
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - "!**/*.map"
# 浏览器扩展随包携带：安装后位于 resources/extension（mac 在 .app/Contents/Resources/extension）
extraResources:
  - from: extension
    to: extension
    filter:
      - "**/*"
      - "!README.md"
mac:
  category: public.app-category.education
  identity: null
  target:
    - target: dir
    - target: zip
win:
  target:
    - target: dir
    - target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 安装向导界面使用简体中文
  installerLanguages:
    - zh_CN
npmRebuild: false
